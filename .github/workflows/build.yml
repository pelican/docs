name: 'Build'
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      # Bun installs and runs the scripts; Next.js itself still builds on Node.
      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 'Cache Bun packages'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      - name: 'Check content (MDX that could run code)'
        run: bun run check:content

      - name: 'Test the content check'
        run: bun run test:content
      - name: 'Test the router'
        run: bun run test:router

      - name: 'Typecheck'
        run: bun run typecheck

      # prebuild runs check:content again (Netlify builds run it there);
      # postbuild runs check:paths on out/.
      - name: 'Build'
        run: bun run build
