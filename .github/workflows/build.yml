name: 'Build'
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Install pnpm'
        uses: pnpm/action-setup@v6

      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck'
        run: pnpm typecheck

      - name: 'Build'
        run: pnpm build
