# Publishes this branch's built /docs as static files for the Hub's preview deployment
# (hub-preview.pelican.dev), so the preview shows the whole one-site pelican.dev: the Hub's
# pages and these docs under /docs.
#
# The branch preview/docs-under-docs holds exactly what the Hub serves under /docs on the
# preview: out/docs/*, plus out/_next/ as _next/ (pages load /docs/_next/... because of
# assetPrefix, while the export writes those files to out/_next/), plus BUILD.json naming the
# commit. The Hub installs it into its storage on the preview host
# (App\Services\Site\DocsPreviewService); the last step asks the preview to check for the new
# build right away. The branch name stays, so the Hub's SITE_DOCS_PREVIEW_BRANCH doesn't change.
#
# Runs on feat/fumadocs-next (pelican/docs#234), which has held this work since #239 was merged.
name: 'Preview build'
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/fumadocs-next'

concurrency:
  group: preview-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: 'Build and publish /docs for the Hub preview'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 'Cache Bun packages'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile

      # prebuild checks the content, postbuild checks every file lands where it should.
      - name: 'Build'
        run: bun run build

      - name: 'Assemble the /docs folder'
        run: |
          rm -rf preview
          mkdir preview
          cp -R out/docs/. preview/
          cp -R out/_next preview/_next
          test -f preview/index.html
          test -d preview/_next/static
          printf '{"sha":"%s","branch":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > preview/BUILD.json

      - name: 'Publish to preview/docs-under-docs'
        working-directory: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Docs preview build of ${GITHUB_SHA::10} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/preview/docs-under-docs

      # Not fatal: the preview also checks on its own every 10 minutes and on the first visit.
      - name: 'Ask the Hub preview to install it'
        run: curl -fsS --max-time 60 https://hub-preview.pelican.dev/docs/_refresh || echo "The preview will pick it up on its next check."
