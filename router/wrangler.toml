# The pelican.dev router (worker.mjs). NOT DEPLOYED: production serves pelican.dev, docs
# included, from the Hub on Forge. This is the option for later, if the docs must stay up
# while the Hub is down (router/README.md, "Switching to the Worker").
# It is a plain ES module (wrangler bundles its import of paths.mjs) with no bindings beyond
# the two origins. To try it: `bunx wrangler deploy --route "next.pelican.dev/*"`.
name = "pelican-dev-router"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false

[vars]
DOCS_ORIGIN = "https://pelica.netlify.app"
HUB_ORIGIN = "https://hub.pelican.dev"

# For the switch, the route below, with the pelican.dev record proxied (orange cloud):
# routes = [{ pattern = "pelican.dev/*", zone_name = "pelican.dev" }]
